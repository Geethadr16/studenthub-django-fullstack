
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Student Management System{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fb;
            font-family: Arial, sans-serif;
            color: #172b4d;
        }

        .navbar {
            background-color: #172b4d;
        }

        .navbar-brand {
            font-weight: 700;
            color: white;
        }

        .navbar-brand:hover {
            color: #dbeafe;
        }

        .card {
            border: none;
            border-radius: 14px;
        }

        .btn {
            border-radius: 8px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            border-radius: 8px;
            padding: 11px 14px;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            StudentHub
        </a>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted py-4 small">
    Student Management System | Built with Django & Bootstrap
</footer>

{% block extra_js %}{% endblock %}

</body>
</html>
